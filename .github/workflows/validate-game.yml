name: Validate Knight Run

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run game tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Install API dependencies
        run: npm ci --prefix api
      - name: Run API tests
        run: npm --prefix api test
